[build-system]
requires = ["setuptools>=77.0.3", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-drive-layer"
version = "0.12.3"
description = "Native Yunyi product Runtime with an internal C++ Motor core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Motor-Drive-Layer contributors" }]
classifiers = [
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/TheYoungW/Motor-Drive-Layer"
Repository = "https://github.com/TheYoungW/Motor-Drive-Layer"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["motor_drive_layer_native"]

[tool.setuptools.package-data]
motor_drive_layer_native = ["PAYLOAD", "lib/*"]
