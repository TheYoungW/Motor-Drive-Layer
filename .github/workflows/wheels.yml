name: Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheel:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            wheel_platform: "manylinux_2_34_x86_64"
          - name: linux-aarch64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python packaging tool
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools and pinned Pinocchio C++ headers
        run: python -m pip install --upgrade build 'libpinocchio==3.8.0' cmeel-eigen cmeel-urdfdom-headers

      - name: Build private Linux libusb runtime
        run: bash scripts/build_private_libusb.sh "$RUNNER_TEMP/libusb-1.0.27"

      - name: Configure and build native libraries
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"] + "/cmeel.prefix")')"
          cmake --build build --config Release
          ctest --test-dir build --build-config Release --output-on-failure --timeout 180

      - name: Install native SDK artifact
        run: |
          cmake --install build --config Release \
            --prefix "${{ runner.temp }}/motor-drive-layer-native"
          mkdir -p "${{ runner.temp }}/motor-drive-layer-native/lib/dm_device"
          cp "${{ runner.temp }}/libusb-1.0.27/lib/libusb-1.0.so.0" \
            "${{ runner.temp }}/motor-drive-layer-native/lib/dm_device/libusb-1.0.so.0"

      - name: Build ARM64 binary-only wheel
        if: matrix.name == 'linux-aarch64'
        env:
          MOTOR_PRIVATE_LIBUSB_LIB: ${{ runner.temp }}/libusb-1.0.27/lib/libusb-1.0.so.0
        run: python -m build --wheel packaging/pypi

      - name: Build x86_64 binary-only wheel
        if: matrix.name == 'linux-x86_64'
        env:
          _PYTHON_HOST_PLATFORM: ${{ matrix.wheel_platform }}
          MOTOR_PRIVATE_LIBUSB_LIB: ${{ runner.temp }}/libusb-1.0.27/lib/libusb-1.0.so.0
        run: python -m build --wheel packaging/pypi

      - name: Repair ARM64 wheel
        if: matrix.name == 'linux-aarch64'
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/libusb-1.0.27/lib
        run: |
          python -m pip install --upgrade auditwheel patchelf
          python -m auditwheel repair packaging/pypi/dist/*.whl --wheel-dir wheelhouse

      - name: Collect x86_64 wheel
        if: matrix.name == 'linux-x86_64'
        run: |
          mkdir -p wheelhouse
          cp packaging/pypi/dist/*.whl wheelhouse/

      - name: Install and verify binary-only wheel
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('wheelhouse').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
          cd /tmp
          python - <<'PY'
          import ctypes
          import importlib.util
          import subprocess
          from importlib.metadata import distribution, version
          from pathlib import Path

          assert version("motor-drive-layer") == "0.10.21"
          assert importlib.util.find_spec("motor_drive_layer") is None
          dist = distribution("motor-drive-layer")
          entries = {str(item): item for item in dist.files or ()}
          assert not any(name.endswith((".py", ".pyi")) for name in entries)
          motor = Path(dist.locate_file(entries["motor_drive_layer_native/lib/libmotor_abi.so"]))
          runtime = Path(dist.locate_file(entries["motor_drive_layer_native/lib/libarticore_runtime.so"]))
          motor_lib = ctypes.CDLL(str(motor))
          motor_lib.motor_abi_version.restype = ctypes.c_char_p
          assert motor_lib.motor_abi_version() == b"0.5.0-cpp"
          runtime_lib = ctypes.CDLL(str(runtime))
          runtime_lib.articore_runtime_abi_version.restype = ctypes.c_uint32
          assert runtime_lib.articore_runtime_abi_version() == 0x0002000F
          dynamic = subprocess.check_output(["readelf", "-d", runtime], text=True)
          exports = subprocess.check_output(["nm", "-D", "--defined-only", runtime], text=True)
          assert "libpinocchio" not in dynamic
          assert "libboost_serialization" not in dynamic
          assert "_ZN9pinocchio" not in exports
          assert not (runtime.parent / "robotics").exists()
          PY

      - name: Verify robot model under a poisoned ROS library path
        run: |
          mkdir -p "$RUNNER_TEMP/ros-collision"
          cp /bin/false "$RUNNER_TEMP/ros-collision/libpinocchio_default.so.3.8.0"
          cp /bin/false "$RUNNER_TEMP/ros-collision/libboost_serialization.so.1.89.0"
          c++ -shared -fPIC \
            "$GITHUB_WORKSPACE/articore_runtime/tests/pinocchio_interposer.cpp" \
            -Wl,-soname,libpinocchio_default.so.3.8.0 \
            -o "$RUNNER_TEMP/ros-collision/libpinocchio_interposer.so"
          cd /tmp
          PINOCCHIO_INTERPOSER="$RUNNER_TEMP/ros-collision/libpinocchio_interposer.so" \
          LD_LIBRARY_PATH="$RUNNER_TEMP/ros-collision" python - <<'PY'
          import ctypes
          import os
          from importlib.metadata import distribution
          from pathlib import Path

          dist = distribution("motor-drive-layer")
          entry = next(
              item for item in dist.files or ()
              if str(item) == "motor_drive_layer_native/lib/libarticore_runtime.so"
          )
          runtime = Path(dist.locate_file(entry))
          ctypes.CDLL(os.environ["PINOCCHIO_INTERPOSER"], mode=ctypes.RTLD_GLOBAL)
          library = ctypes.CDLL(str(runtime))
          library.articore_robot_model_create.argtypes = [ctypes.c_char_p, ctypes.c_uint32]
          library.articore_robot_model_create.restype = ctypes.c_void_p
          library.articore_robot_model_free.argtypes = [ctypes.c_void_p]
          model = library.articore_robot_model_create(b"yunyi_v1_0", 0)
          assert model
          library.articore_robot_model_free(model)
          PY

      - name: Verify x86_64 private vendor dependencies
        if: matrix.name == 'linux-x86_64'
        run: |
          cd /tmp
          env -u LD_LIBRARY_PATH -u MOTOR_DM_DEVICE_LIB python - <<'PY'
          import ctypes
          import re
          import subprocess
          from importlib.metadata import distribution
          from pathlib import Path

          dist = distribution("motor-drive-layer")
          entries = {str(item): item for item in dist.files or ()}
          root = Path(dist.locate_file(entries["motor_drive_layer_native/PAYLOAD"])).parent
          package_lib = root / "lib"
          package_dm = package_lib / "dm_device"
          linkage = subprocess.check_output(["ldd", str(package_lib / "libmotor_abi.so")], text=True)
          assert "/dm_device/libstdc++.so.6" in linkage, linkage
          for library in package_lib.rglob("*.so*"):
              versions = re.findall(
                  r"GLIBC_(\d+)\.(\d+)",
                  subprocess.check_output(["readelf", "--version-info", str(library)], text=True),
              )
              assert not versions or max((int(a), int(b)) for a, b in versions) <= (2, 34)
          ctypes.CDLL(str(package_dm / "libstdc++.so.6"), mode=ctypes.RTLD_GLOBAL)
          support = ctypes.CDLL(str(package_dm / "libusb-1.0.so.0"), mode=ctypes.RTLD_GLOBAL)
          assert support.libusb_init_context
          vendor = ctypes.CDLL(str(package_dm / "v1.1.0" / "libdm_device.so"))
          assert vendor.dmcan_context_create
          PY

      - name: Verify ARM64 vendor library resolves
        if: matrix.name == 'linux-aarch64'
        run: |
          cd /tmp
          env -u LD_LIBRARY_PATH -u MOTOR_DM_DEVICE_LIB python - <<'PY'
          import ctypes
          from importlib.metadata import distribution
          from pathlib import Path

          dist = distribution("motor-drive-layer")
          vendor_entry = next(
              item for item in dist.files or ()
              if str(item).endswith("motor_drive_layer_native/lib/dm_device/v1.1.0/libdm_device.so")
          )
          vendor = Path(dist.locate_file(vendor_entry))
          ctypes.CDLL(str(vendor))
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload native SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.name }}
          path: ${{ runner.temp }}/motor-drive-layer-native
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" wheels/*.whl --repo "${GITHUB_REPOSITORY}" --generate-notes --title "motor-drive-layer ${GITHUB_REF_NAME#v}"
