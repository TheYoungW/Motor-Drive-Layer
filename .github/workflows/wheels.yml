name: Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheel:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            family: linux
            deployment_target: ""
            # The bundled v1.0 vendor runtime needs two newer GLIBCXX symbols,
            # which are supplied by the wheel's private libstdc++.  Auditwheel
            # treats libstdc++ as a system library and would therefore
            # over-tag this Ubuntu 22.04-compatible wheel as manylinux_2_39.
            wheel_platform: "manylinux_2_34_x86_64"
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            family: linux
            deployment_target: ""
            wheel_platform: ""
          - name: macos-x86_64
            runner: macos-15-intel
            family: macos
            deployment_target: "11.0"
            wheel_platform: "macosx-11.0-x86_64"
          - name: macos-arm64
            runner: macos-15
            family: macos
            deployment_target: "11.0"
            wheel_platform: "macosx-11.0-arm64"
          - name: windows-amd64
            runner: windows-2025
            family: windows
            deployment_target: ""
            wheel_platform: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build pytest

      - name: Build private Linux libusb runtime
        if: matrix.family == 'linux'
        run: bash scripts/build_private_libusb.sh "$RUNNER_TEMP/libusb-1.0.27"

      - name: Configure C++ ABI
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.family == 'macos' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0' || '' }}

      - name: Build C++ ABI
        run: cmake --build build --config Release

      - name: Run C++ tests
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 180

      - name: Run Python tests
        env:
          PYTHONPATH: bindings/python/src
        run: python -m pytest -q bindings/python/tests

      - name: Build platform wheel
        if: matrix.family != 'macos' && matrix.name != 'linux-x86_64'
        run: python -m build --wheel bindings/python

      - name: Build self-contained Linux x86_64 wheel
        if: matrix.name == 'linux-x86_64'
        env:
          _PYTHON_HOST_PLATFORM: ${{ matrix.wheel_platform }}
          MOTOR_PRIVATE_LIBUSB_LIB: ${{ runner.temp }}/libusb-1.0.27/lib/libusb-1.0.so.0
        run: python -m build --wheel bindings/python

      - name: Build macOS platform wheel
        if: matrix.family == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          _PYTHON_HOST_PLATFORM: ${{ matrix.wheel_platform }}
        run: python -m build --wheel bindings/python

      - name: Repair Linux wheel
        if: matrix.family == 'linux' && matrix.name != 'linux-x86_64'
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/libusb-1.0.27/lib
        run: |
          python -m pip install --upgrade auditwheel patchelf
          python -m auditwheel repair bindings/python/dist/*.whl --wheel-dir wheelhouse

      - name: Collect self-contained Linux x86_64 wheel
        if: matrix.name == 'linux-x86_64'
        run: |
          mkdir -p wheelhouse
          cp bindings/python/dist/*.whl wheelhouse/

      - name: Repair macOS wheel
        if: matrix.family == 'macos'
        run: |
          python -m pip install --upgrade delocate
          delocate-wheel --wheel-dir wheelhouse --verbose bindings/python/dist/*.whl

      - name: Collect Windows wheel
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wheelhouse
          Copy-Item bindings/python/dist/*.whl wheelhouse/

      - name: Install and verify wheel
        if: matrix.family != 'macos'
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('wheelhouse').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
          python -c "from importlib.metadata import version; import motor_drive_layer as mdl; assert mdl.get_version() == version('motor-drive-layer'); assert mdl.abi_version() == '0.5.0-cpp'; assert mdl.abi_capabilities()['features']['register_metadata'] is True; assert mdl.articore_runtime_library_path(); assert mdl.articore_runtime_abi_version() == '1.8'; assert mdl.articore_runtime_capabilities()['gripper_protection'] is True; assert mdl.articore_runtime_capabilities()['current_position_hold'] is True; assert mdl.articore_runtime_capabilities()['motor_presence'] is True; assert mdl.articore_runtime_capabilities()['realtime_joint_mailbox'] is True; assert mdl.articore_runtime_capabilities()['joint_trajectory'] is True; assert mdl.articore_runtime_capabilities()['atomic_enable'] is True; assert mdl.articore_runtime_capabilities()['command_lifetime'] is True; assert mdl.articore_runtime_capabilities()['nonpreemptive_trajectory'] is True; assert mdl.articore_runtime_capabilities()['protective_fault_hold'] is True; assert mdl.articore_runtime_capabilities()['deterministic_disable'] is True; assert mdl.articore_runtime_capabilities()['trajectory_management'] is True; assert mdl.articore_runtime_capabilities()['trajectory_settling'] is True; vendor = mdl.ensure_dm_device_runtime(auto_download=False); assert vendor.is_file()"

      - name: Verify macOS wheel contents
        if: matrix.family == 'macos'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("wheelhouse").glob("*.whl"))
          # DaMiao's current official v1.1 dylib declares macOS 26 as its
          # deployment target. Keep the wheel tag truthful instead of
          # pretending that direct DM_Device transport works on older macOS.
          assert "macosx_26_0" in wheel.name, wheel.name
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith("motor_drive_layer/lib/libmotor_abi.dylib") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/libarticore_runtime.dylib") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/dm_device/v1.1.0/libdm_device.dylib") for name in names)
          PY

      - name: Verify bundled Linux x86_64 vendor dependencies
        if: matrix.name == 'linux-x86_64'
        run: |
          cd /tmp
          env -u LD_LIBRARY_PATH -u MOTOR_DM_DEVICE_LIB python - <<'PY'
          import ctypes
          import re
          import subprocess
          from pathlib import Path
          import motor_drive_layer as mdl

          # Loading motor_abi first resolves libstdc++ from its private RPATH.
          assert mdl.abi_version() == "0.5.0-cpp"
          vendor = mdl.ensure_dm_device_runtime(auto_download=False)
          package_lib = Path(mdl.__file__).resolve().parent / "lib"
          package_dm = package_lib / "dm_device"
          assert vendor.parent.name == "v1.0.0", vendor
          modern_vendor = package_dm / "v1.1.0" / "libdm_device.so"
          private_libusb = package_dm / "libusb-1.0.so.0"
          assert private_libusb.is_file(), private_libusb
          linkage = subprocess.check_output(
              ["ldd", str(package_lib / "libmotor_abi.so")], text=True
          )
          assert "/dm_device/libstdc++.so.6" in linkage, linkage

          # We intentionally supply the newer GLIBCXX definitions privately;
          # all ELF files must still stay within the claimed glibc baseline.
          for library in package_lib.rglob("*.so*"):
              versions = re.findall(
                  r"GLIBC_(\d+)\.(\d+)",
                  subprocess.check_output(
                      ["readelf", "--version-info", str(library)], text=True
                  ),
              )
              assert not versions or max(
                  (int(major), int(minor)) for major, minor in versions
              ) <= (2, 34), library

          ctypes.CDLL(
              str(package_dm / "libstdc++.so.6"),
              mode=ctypes.RTLD_GLOBAL,
          )
          support = ctypes.CDLL(str(private_libusb), mode=ctypes.RTLD_GLOBAL)
          assert support.libusb_init_context
          vendor_library = ctypes.CDLL(str(modern_vendor))
          assert vendor_library.dmcan_context_create
          PY

      - name: Verify bundled Linux ARM64 vendor dependencies
        if: matrix.name == 'linux-aarch64'
        run: |
          cd /tmp
          env -u LD_LIBRARY_PATH -u MOTOR_DM_DEVICE_LIB python - <<'PY'
          import ctypes
          import subprocess
          from pathlib import Path
          import motor_drive_layer as mdl

          assert mdl.abi_version() == "0.5.0-cpp"
          vendor = mdl.ensure_dm_device_runtime(auto_download=False)
          linkage = subprocess.check_output(["ldd", str(vendor)], text=True)
          assert "motor_drive_layer.libs/libusb" in linkage, linkage

          package_root = Path(mdl.__file__).resolve().parent.parent
          support_libraries = list(
              package_root.glob("motor_drive_layer.libs/libusb*.so*")
          )
          assert len(support_libraries) == 1, support_libraries
          support = ctypes.CDLL(str(support_libraries[0]))
          assert support.libusb_init_context

          # This is the check missing from 0.7.4: resolve every symbol in the
          # actual ARM64 vendor v1.1 library, not merely confirm its filename.
          ctypes.CDLL(str(vendor))
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" wheels/*.whl --repo "${GITHUB_REPOSITORY}" --generate-notes --title "motor-drive-layer ${GITHUB_REF_NAME#v}"
