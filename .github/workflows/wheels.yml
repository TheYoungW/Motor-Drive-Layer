name: Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheel:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: linux-aarch64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python packaging tool
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools and pinned Pinocchio C++ headers
        run: python -m pip install --upgrade build 'libpinocchio==3.8.0' cmeel-eigen cmeel-urdfdom-headers

      - name: Configure and build native libraries
        run: |
          cmake -S . -B builds/cmake/ci -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"] + "/cmeel.prefix")')"
          cmake --build builds/cmake/ci --config Release
          ctest --test-dir builds/cmake/ci --build-config Release --output-on-failure --timeout 180

      - name: Install native SDK artifact
        run: |
          cmake --install builds/cmake/ci --config Release \
            --prefix "${{ runner.temp }}/motor-drive-layer-native"

      - name: Build binary-only wheel
        env:
          ARTICORE_RUNTIME_LIB: ${{ github.workspace }}/builds/cmake/ci/articore_runtime/libarticore_runtime.so
        run: python -m build --wheel --outdir builds/wheels/raw packaging/pypi

      - name: Repair binary-only wheel
        run: |
          python -m pip install --upgrade auditwheel patchelf
          python -m auditwheel repair builds/wheels/raw/*.whl --wheel-dir wheelhouse

      - name: Install and verify binary-only wheel
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('wheelhouse').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
          cd /tmp
          python - <<'PY'
          import ctypes
          import importlib.util
          import subprocess
          from importlib.metadata import distribution, version
          from pathlib import Path

          assert version("motor-drive-layer") == "0.13.1"
          assert importlib.util.find_spec("motor_drive_layer") is None
          dist = distribution("motor-drive-layer")
          entries = {str(item): item for item in dist.files or ()}
          assert not any(name.endswith((".py", ".pyi")) for name in entries)
          runtime = Path(dist.locate_file(entries["motor_drive_layer_native/lib/libarticore_runtime.so"]))
          assert not any("libmotor_abi" in name or "/dm_device/" in name for name in entries)
          runtime_lib = ctypes.CDLL(str(runtime))
          runtime_lib.articore_runtime_abi_version.restype = ctypes.c_uint32
          assert runtime_lib.articore_runtime_abi_version() == 0x00040001
          assert hasattr(runtime_lib, "articore_runtime_create_yunyi")
          assert not hasattr(runtime_lib, "articore_runtime_create_yunyi_v2")
          assert hasattr(runtime_lib, "articore_runtime_move_pose")
          assert hasattr(runtime_lib, "articore_runtime_move_poses")
          assert not hasattr(runtime_lib, "articore_runtime_get_move_pose_status")
          assert not hasattr(runtime_lib, "articore_runtime_cancel_move_pose")
          assert not hasattr(runtime_lib, "articore_runtime_move_cartesian")
          assert hasattr(runtime_lib, "articore_runtime_move_linear_v2")
          assert hasattr(runtime_lib, "articore_runtime_move_circular")
          runtime_lib.articore_runtime_capabilities.restype = ctypes.c_uint64
          capabilities = runtime_lib.articore_runtime_capabilities()
          assert capabilities & (1 << 55)
          assert hasattr(runtime_lib, "articore_runtime_move_circular_v2")
          assert capabilities & (1 << 56)
          assert hasattr(runtime_lib, "articore_runtime_get_state_v3")
          assert capabilities & (1 << 57)
          assert capabilities & (1 << 58)
          assert hasattr(runtime_lib, "articore_runtime_get_joint_angle_vel_limits")
          assert capabilities & (1 << 59)
          assert hasattr(runtime_lib, "articore_runtime_set_joint_pv")
          assert hasattr(runtime_lib, "articore_runtime_set_joint_mit")
          assert hasattr(runtime_lib, "articore_runtime_submit_mit_frame")
          assert not hasattr(runtime_lib, "articore_runtime_set_joint_positions")
          assert not hasattr(runtime_lib, "articore_runtime_set_joint_positions_v2")
          assert not hasattr(runtime_lib, "articore_runtime_submit_pv_frame")
          assert not hasattr(runtime_lib, "articore_runtime_set_speed")
          assert not hasattr(runtime_lib, "articore_runtime_get_speed")
          assert not hasattr(runtime_lib, "articore_runtime_submit_pos_vel")
          assert not hasattr(runtime_lib, "articore_runtime_submit_pos_vel_ex")
          assert not hasattr(runtime_lib, "articore_runtime_submit_mit")
          assert not hasattr(runtime_lib, "articore_runtime_submit_mit_ex")
          assert capabilities & (1 << 60)
          assert hasattr(runtime_lib, "articore_runtime_set_max_speed")
          assert hasattr(runtime_lib, "articore_runtime_get_max_speed")
          assert capabilities & (1 << 63)
          assert capabilities & ((1 << 23) | (1 << 27)) == 0
          assert not hasattr(runtime_lib, "articore_runtime_get_control_hz")
          dynamic = subprocess.check_output(["readelf", "-d", runtime], text=True)
          exports = subprocess.check_output(["nm", "-D", "--defined-only", runtime], text=True)
          assert "libpinocchio" not in dynamic
          assert "libboost_serialization" not in dynamic
          assert "_ZN9pinocchio" not in exports
          assert not (runtime.parent / "robotics").exists()
          PY

      - name: Verify robot model under a poisoned ROS library path
        run: |
          mkdir -p "$RUNNER_TEMP/ros-collision"
          cp /bin/false "$RUNNER_TEMP/ros-collision/libpinocchio_default.so.3.8.0"
          cp /bin/false "$RUNNER_TEMP/ros-collision/libboost_serialization.so.1.89.0"
          c++ -shared -fPIC \
            "$GITHUB_WORKSPACE/articore_runtime/tests/pinocchio_interposer.cpp" \
            -Wl,-soname,libpinocchio_default.so.3.8.0 \
            -o "$RUNNER_TEMP/ros-collision/libpinocchio_interposer.so"
          cd /tmp
          PINOCCHIO_INTERPOSER="$RUNNER_TEMP/ros-collision/libpinocchio_interposer.so" \
          LD_LIBRARY_PATH="$RUNNER_TEMP/ros-collision" python - <<'PY'
          import ctypes
          import os
          from importlib.metadata import distribution
          from pathlib import Path

          dist = distribution("motor-drive-layer")
          entry = next(
              item for item in dist.files or ()
              if str(item) == "motor_drive_layer_native/lib/libarticore_runtime.so"
          )
          runtime = Path(dist.locate_file(entry))
          ctypes.CDLL(os.environ["PINOCCHIO_INTERPOSER"], mode=ctypes.RTLD_GLOBAL)
          library = ctypes.CDLL(str(runtime))
          library.articore_robot_model_create.argtypes = [ctypes.c_char_p, ctypes.c_uint32]
          library.articore_robot_model_create.restype = ctypes.c_void_p
          library.articore_robot_model_free.argtypes = [ctypes.c_void_p]
          model = library.articore_robot_model_create(b"yunyi_v1_0", 0)
          assert model
          library.articore_robot_model_free(model)
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload native SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.name }}
          path: ${{ runner.temp }}/motor-drive-layer-native
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" wheels/*.whl --repo "${GITHUB_REPOSITORY}" --generate-notes --title "motor-drive-layer ${GITHUB_REF_NAME#v}"

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all platform wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: Verify one distribution with both Linux architectures
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheels = sorted(Path("wheels").glob("*.whl"))
          assert len(wheels) == 2, wheels
          names = [wheel.name for wheel in wheels]
          assert all(name.startswith(f"motor_drive_layer-{version}-") for name in names), names
          assert sum(name.endswith("_x86_64.whl") for name in names) == 1, names
          assert sum(name.endswith("_aarch64.whl") for name in names) == 1, names
          PY

      - name: Publish both wheels to the single motor-drive-layer project
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: wheels/
