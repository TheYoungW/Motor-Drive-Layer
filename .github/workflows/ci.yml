name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test tools
        run: python -m pip install --upgrade build pytest

      - name: Configure C++ ABI
        run: cmake -S . -B build

      - name: Build C++ ABI
        run: cmake --build build

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Python tests
        env:
          PYTHONPATH: bindings/python/src
        run: python -m pytest -q bindings/python/tests

      - name: Build Python wheel with C++ ABI
        run: python -m build --wheel bindings/python

      - name: Verify and install built wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("bindings/python/dist").glob("*.whl"))
          assert "-py3-none-" in wheel.name, wheel.name
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith("/licenses/LICENSE") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/libmotor_abi.so") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/libarticore_runtime.so") for name in names)
          PY
          python -m pip install --force-reinstall --no-deps bindings/python/dist/*.whl
          cd /tmp
          python - <<'PY'
          import motor_drive_layer
          from importlib.metadata import version

          assert motor_drive_layer.get_version() == version("motor-drive-layer")
          assert motor_drive_layer.abi_version() == "0.5.0-cpp"
          assert motor_drive_layer.abi_capabilities()["features"]["feedback_stats"] is True
          assert motor_drive_layer.abi_capabilities()["features"]["register_metadata"] is True
          runtime_path = motor_drive_layer.articore_runtime_library_path()
          assert runtime_path.endswith("libarticore_runtime.so")
          assert motor_drive_layer.articore_runtime_abi_version() == "1.1"
          assert motor_drive_layer.articore_runtime_capabilities()["safe_hold"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["current_position_hold"] is True
          PY

      - name: Check shell helper syntax
        run: bash -n scripts/*.sh

      - name: No obsolete source workspace remains
        run: |
          test -z "$(find . -path ./.git -prune -o -name '*.rs' -print)"
          test ! -d integrations/ros2_bridge
