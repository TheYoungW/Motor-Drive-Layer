name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test tools
        run: python -m pip install --upgrade build pytest

      - name: Build private libusb runtime
        run: bash scripts/build_private_libusb.sh "$RUNNER_TEMP/libusb-1.0.27"

      - name: Configure C++ ABI
        run: cmake -S . -B build

      - name: Build C++ ABI
        run: cmake --build build

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Verify installed C++ RAII package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/motor-drive-layer"
          cmake -S tests/cmake_package -B build/cmake-consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/motor-drive-layer"
          cmake --build build/cmake-consumer
          "$PWD/build/cmake-consumer/motor_drive_layer_consumer"

      - name: Run Python tests
        env:
          PYTHONPATH: bindings/python/src
        run: python -m pytest -q bindings/python/tests

      - name: Build Python wheel with C++ ABI
        env:
          MOTOR_PRIVATE_LIBUSB_LIB: ${{ runner.temp }}/libusb-1.0.27/lib/libusb-1.0.so.0
        run: python -m build --wheel bindings/python

      - name: Verify and install built wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("bindings/python/dist").glob("*.whl"))
          assert "-py3-none-" in wheel.name, wheel.name
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith("/licenses/LICENSE") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/libmotor_abi.so") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/libarticore_runtime.so") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/dm_device/v1.0.0/libdm_device.so") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/dm_device/v1.1.0/libdm_device.so") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/dm_device/libstdc++.so.6") for name in names)
              assert any(name.endswith("motor_drive_layer/lib/dm_device/libusb-1.0.so.0") for name in names)
          PY
          python -m pip install --force-reinstall --no-deps bindings/python/dist/*.whl
          cd /tmp
          python - <<'PY'
          import motor_drive_layer
          import ctypes
          from importlib.metadata import version

          assert motor_drive_layer.get_version() == version("motor-drive-layer")
          assert motor_drive_layer.ArticoreRuntime
          assert motor_drive_layer.RuntimeConfig
          assert motor_drive_layer.abi_version() == "0.5.0-cpp"
          assert motor_drive_layer.abi_capabilities()["features"]["feedback_stats"] is True
          assert motor_drive_layer.abi_capabilities()["features"]["register_metadata"] is True
          runtime_path = motor_drive_layer.articore_runtime_library_path()
          assert runtime_path.endswith("libarticore_runtime.so")
          assert motor_drive_layer.articore_runtime_abi_version() == "2.3"
          assert motor_drive_layer.articore_runtime_capabilities()["connect_feedback_barrier"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["safe_hold"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["current_position_hold"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["realtime_joint_mailbox"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["atomic_enable"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["command_lifetime"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["protective_fault_hold"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["deterministic_disable"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["layered_joint_limits"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["gripper_command_profiles"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["gripper_force_10_levels"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["joint_mit_position"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["joint_pv_position"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["effective_control_rate"] is True
          assert motor_drive_layer.articore_runtime_capabilities()["builtin_gripper_product_profiles"] is True
          vendor_path = motor_drive_layer.ensure_dm_device_runtime(auto_download=False)
          assert vendor_path.parent.name == "v1.0.0"
          assert vendor_path.is_file()
          package_dm = vendor_path.parent.parent
          private_libusb = package_dm / "libusb-1.0.so.0"
          assert private_libusb.is_file()
          support = ctypes.CDLL(str(private_libusb), mode=ctypes.RTLD_GLOBAL)
          assert support.libusb_init_context
          private_stdcxx = package_dm / "libstdc++.so.6"
          ctypes.CDLL(str(private_stdcxx), mode=ctypes.RTLD_GLOBAL)
          vendor = ctypes.CDLL(str(package_dm / "v1.1.0" / "libdm_device.so"))
          assert vendor.dmcan_context_create
          PY

      - name: Check shell helper syntax
        run: bash -n scripts/*.sh

      - name: No obsolete source workspace remains
        run: |
          test -z "$(find . -path ./.git -prune -o -name '*.rs' -print)"
          test ! -d integrations/ros2_bridge
