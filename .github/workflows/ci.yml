name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python packaging tool
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools and pinned Pinocchio C++ headers
        run: python -m pip install --upgrade build 'libpinocchio==3.8.0' cmeel-eigen cmeel-urdfdom-headers

      - name: Configure and build native libraries
        run: |
          cmake -S . -B builds/cmake/ci \
            -DCMAKE_PREFIX_PATH="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"] + "/cmeel.prefix")')"
          cmake --build builds/cmake/ci

      - name: Run native tests
        run: ctest --test-dir builds/cmake/ci --output-on-failure --timeout 180

      - name: Verify installed C++ RAII package
        run: |
          cmake --install builds/cmake/ci --prefix "$RUNNER_TEMP/motor-drive-layer"
          cmake -S tests/cmake_package -B builds/cmake/cmake-consumer \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/motor-drive-layer"
          cmake --build builds/cmake/cmake-consumer
          "$PWD/builds/cmake/cmake-consumer/motor_drive_layer_consumer"

      - name: Build binary-only PyPI payload
        env:
          ARTICORE_RUNTIME_LIB: ${{ github.workspace }}/builds/cmake/ci/articore_runtime/libarticore_runtime.so
        run: python -m build --wheel --outdir builds/wheels/raw packaging/pypi

      - name: Verify binary-only wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("builds/wheels/raw").glob("*.whl"))
          assert "-py3-none-" in wheel.name, wheel.name
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert not any(name.endswith((".py", ".pyi")) for name in names)
          assert "motor_drive_layer_native/lib/libarticore_runtime.so" in names
          assert not any("/robotics/" in name for name in names)
          assert not any("libmotor_abi" in name or "/dm_device/" in name for name in names)
          PY
          python -m pip install --force-reinstall --no-deps builds/wheels/raw/*.whl
          cd /tmp
          python - <<'PY'
          import ctypes
          import importlib.util
          from importlib.metadata import distribution, version

          assert version("motor-drive-layer") == "0.11.1"
          assert importlib.util.find_spec("motor_drive_layer") is None
          dist = distribution("motor-drive-layer")
          files = {str(item): dist.locate_file(item) for item in dist.files or ()}
          runtime = files["motor_drive_layer_native/lib/libarticore_runtime.so"]
          runtime_lib = ctypes.CDLL(str(runtime))
          runtime_lib.articore_runtime_abi_version.restype = ctypes.c_uint32
          assert runtime_lib.articore_runtime_abi_version() == 0x00020028
          assert hasattr(runtime_lib, "articore_runtime_create_yunyi_v2")
          runtime_lib.articore_runtime_capabilities.restype = ctypes.c_uint64
          capabilities = runtime_lib.articore_runtime_capabilities()
          assert capabilities & (1 << 62)
          assert capabilities & (1 << 63)
          assert capabilities & ((1 << 23) | (1 << 27)) == 0
          assert not hasattr(runtime_lib, "articore_runtime_get_control_hz")
          runtime_lib.articore_robot_model_create.argtypes = [ctypes.c_char_p, ctypes.c_uint32]
          runtime_lib.articore_robot_model_create.restype = ctypes.c_void_p
          runtime_lib.articore_robot_model_free.argtypes = [ctypes.c_void_p]
          model = runtime_lib.articore_robot_model_create(b"yunyi_v1_0", 0)
          assert model
          runtime_lib.articore_robot_model_free(model)
          PY

      - name: Verify ROS library-path isolation
        run: |
          mkdir -p "$RUNNER_TEMP/ros-collision"
          cp /bin/false "$RUNNER_TEMP/ros-collision/libpinocchio_default.so.3.8.0"
          cp /bin/false "$RUNNER_TEMP/ros-collision/libboost_serialization.so.1.89.0"
          c++ -shared -fPIC \
            "$GITHUB_WORKSPACE/articore_runtime/tests/pinocchio_interposer.cpp" \
            -Wl,-soname,libpinocchio_default.so.3.8.0 \
            -o "$RUNNER_TEMP/ros-collision/libpinocchio_interposer.so"
          cd /tmp
          PINOCCHIO_INTERPOSER="$RUNNER_TEMP/ros-collision/libpinocchio_interposer.so" \
          LD_LIBRARY_PATH="$RUNNER_TEMP/ros-collision" python - <<'PY'
          import ctypes
          import os
          import subprocess
          from importlib.metadata import distribution
          from pathlib import Path

          dist = distribution("motor-drive-layer")
          runtime_entry = next(
              item for item in dist.files or ()
              if str(item) == "motor_drive_layer_native/lib/libarticore_runtime.so"
          )
          runtime = Path(dist.locate_file(runtime_entry))
          ctypes.CDLL(os.environ["PINOCCHIO_INTERPOSER"], mode=ctypes.RTLD_GLOBAL)
          library = ctypes.CDLL(str(runtime))
          library.articore_robot_model_create.argtypes = [ctypes.c_char_p, ctypes.c_uint32]
          library.articore_robot_model_create.restype = ctypes.c_void_p
          library.articore_robot_model_free.argtypes = [ctypes.c_void_p]
          model = library.articore_robot_model_create(b"yunyi_v1_0", 0)
          assert model
          library.articore_robot_model_free(model)
          dynamic = subprocess.check_output(["readelf", "-d", runtime], text=True)
          exports = subprocess.check_output(["nm", "-D", "--defined-only", runtime], text=True)
          assert "libpinocchio" not in dynamic
          assert "libboost_serialization" not in dynamic
          assert "_ZN9pinocchio" not in exports
          assert not (runtime.parent / "robotics").exists()
          PY

      - name: Check shell helper syntax
        run: bash -n scripts/*.sh

      - name: Check repository boundary
        run: |
          test ! -d bindings
          test ! -d docs
          test -z "$(find packaging/pypi/src -name '*.py' -o -name '*.pyi')"
          test -z "$(find . -path ./.git -prune -o -name '*.rs' -print)"
          test ! -d integrations/ros2_bridge
