name: motorbridge-1.0

on:
  push:
  pull_request:

env:
  CYCLONEDDS_TAG: 11.0.1
  CYCLONEDDS_COMMIT: e54e991f75a3e67f8e628da3171122e36ea5b872

jobs:
  native-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pinocchio headers
        run: python -m pip install 'libpinocchio==3.8.0' cmeel-eigen cmeel-urdfdom-headers
      - name: Build pinned Cyclone DDS
        run: |
          git clone https://github.com/eclipse-cyclonedds/cyclonedds.git "$RUNNER_TEMP/cyclonedds"
          git -C "$RUNNER_TEMP/cyclonedds" checkout "$CYCLONEDDS_COMMIT"
          test "$(git -C "$RUNNER_TEMP/cyclonedds" describe --tags --exact-match)" = "$CYCLONEDDS_TAG"
          cmake -S "$RUNNER_TEMP/cyclonedds" -B "$RUNNER_TEMP/cyclonedds-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cyclonedds-install"
          cmake --build "$RUNNER_TEMP/cyclonedds-build" --parallel 2
          cmake --install "$RUNNER_TEMP/cyclonedds-build"
      - name: Build service and tests
        run: |
          PIN_PREFIX="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"] + "/cmeel.prefix")')"
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/cyclonedds-install;$PIN_PREFIX"
          cmake --build build/ci --parallel 2
      - name: Run tests
        run: ctest --test-dir build/ci --output-on-failure --timeout 240
      - name: Verify service-only install surface
        run: |
          cmake --install build/ci --prefix "$RUNNER_TEMP/stage"
          test -x "$RUNNER_TEMP/stage/usr/bin/articore-runtime-service"
          test -e "$RUNNER_TEMP/stage/usr/lib/articore/libddsc.so.11"
          test ! -e "$RUNNER_TEMP/stage/include"
          test ! -e "$RUNNER_TEMP/stage/lib/libarticore_runtime.so"
          test ! -d packaging/pypi

  arm64-artifact:
    # This job is the formal product build and expects the RK3588/ARM64 runner
    # image to provide Pinocchio 3.8 C++ and Debian packaging tools.
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v6
      - name: Build Cyclone DDS 11.0.1 natively
        run: |
          git clone https://github.com/eclipse-cyclonedds/cyclonedds.git "$RUNNER_TEMP/cyclonedds"
          git -C "$RUNNER_TEMP/cyclonedds" checkout "$CYCLONEDDS_COMMIT"
          cmake -S "$RUNNER_TEMP/cyclonedds" -B "$RUNNER_TEMP/cyclonedds-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cyclonedds-install"
          cmake --build "$RUNNER_TEMP/cyclonedds-build" --parallel 4
          cmake --install "$RUNNER_TEMP/cyclonedds-build"
      - name: Build and package ARM64 service
        run: |
          cmake -S . -B build/arm64 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/cyclonedds-install"
          cmake --build build/arm64 --parallel 4
          ctest --test-dir build/arm64 --output-on-failure --timeout 240
          cmake --build build/arm64 --target package
      - uses: actions/upload-artifact@v6
        with:
          name: articore-runtime-service-arm64
          path: build/arm64/*.deb
