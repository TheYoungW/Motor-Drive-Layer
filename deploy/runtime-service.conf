# Articore Runtime Service / RK3588
robot_id=yunyi-001
domain_id=0
# Ordered from highest to lowest DDS transport priority. The systemd unit waits
# until at least one configured interface is connected and has a global IP.
# Interfaces unavailable at startup are optional to Cyclone DDS.
dds_interfaces=eth0,eth1,wlan0
left_can_interface=can-left
right_can_interface=can-right
# IDs 1..7 are required arm joints. ID 8 is scanned independently as an
# optional end effector on each CAN channel whenever Runtime starts.
motor_discovery_timeout_ms=25
motor_discovery_retries=8
initial_control_mode=mit

# RK3588 big cores are commonly 4..7; confirm the board topology before use.
realtime=true
lock_memory=true
control_cpu=7
can_tx_cpu=6
can_rx_cpu=5
control_priority=80
can_tx_priority=75
can_rx_priority=75
