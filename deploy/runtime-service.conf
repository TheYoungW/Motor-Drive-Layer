# Articore Runtime Service 1.0.3 / RK3588
robot_id=yunyi-001
domain_id=0
# This RK3588 image exposes its active network interface as wlan0.
dds_interfaces=wlan0
left_can_interface=can-left
right_can_interface=can-right
with_grippers=true
initial_control_mode=mit

# RK3588 big cores are commonly 4..7; confirm the board topology before use.
realtime=true
lock_memory=true
control_cpu=7
can_tx_cpu=6
can_rx_cpu=5
control_priority=80
can_tx_priority=75
can_rx_priority=70
